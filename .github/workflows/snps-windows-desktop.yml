name: SNPS Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: ["feat/github-bridge"]
    paths:
      - ".github/workflows/snps-windows-desktop.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "desktop/**"
      - "rust-toolchain.toml"
      - "scripts/bundle-sidecars.sh"

permissions:
  contents: read

jobs:
  build:
    name: Build Buzz SNPS for Windows
    if: github.repository == 'luisgustavooliveira/buzz'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Derive SNPS version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::SNPS base version '$BASE_VERSION' must be stable semver"
            exit 1
          fi
          VERSION="${BASE_VERSION}-snps.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch SNPS version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Resolve native toolchain identity
        id: native_toolchain
        shell: bash
        run: echo "id=$(scripts/desktop-native-toolchain-id.sh windows)" >> "$GITHUB_OUTPUT"

      - name: Compute exact release cache key
        id: rust_cache_key
        shell: bash
        env:
          NATIVE_TOOLCHAIN_ID: ${{ steps.native_toolchain.outputs.id }}
        run: |
          KEY=$(scripts/desktop-release-cache-key.py \
            --platform "$RUNNER_OS" \
            --target x86_64-pc-windows-msvc \
            --features default \
            --native-inputs "$NATIVE_TOOLCHAIN_ID")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore exact release Cargo cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Generate isolated SNPS bundle config
        shell: bash
        run: node desktop/scripts/snps-build-config.mjs desktop/src-tauri/tauri.snps.conf.json

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Buzz SNPS NSIS installer
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.snps.conf.json
        env:
          BUZZ_RELAY_URL: wss://message-relay.snpsgroup.com
          BUZZ_RELAY_HTTP: https://message-relay.snpsgroup.com
          BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY: "1"
          BUZZ_BUILD_DEMO_SLUG: snps
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Stage and verify installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          mapfile -t EXES < <(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f)
          if [[ ${#EXES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one NSIS installer in $BUNDLE_DIR/nsis"
            exit 1
          fi
          STAGE="dist/snps-windows"
          mkdir -p "$STAGE"
          cp "${EXES[0]}" "$STAGE/"
          cd "$STAGE"
          sha256sum ./*.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          node -e 'require("node:fs").writeFileSync("BUILD-INFO.json", JSON.stringify({version: process.env.VERSION, source_sha: process.env.GITHUB_SHA, relay_url: process.env.BUZZ_RELAY_URL || "wss://message-relay.snpsgroup.com", updater: false, signed: false}, null, 2) + "\n")'

      - name: Upload Buzz SNPS Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-snps-windows-${{ github.sha }}
          path: dist/snps-windows
          if-no-files-found: error
          retention-days: 30

      - name: Save exact release Cargo cache
        if: steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
